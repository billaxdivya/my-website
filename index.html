<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Store</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #0b0b0f;
    color: white;
}

.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 25px;
    background: #111116;
    border-bottom: 1px solid #292933;
}

.logo {
    font-size: 22px;
    font-weight: bold;
}

.nav-btn {
    background: #1d1d26;
    color: white;
    border: 1px solid #343440;
    padding: 9px 15px;
    border-radius: 8px;
}

.hero {
    text-align: center;
    padding: 70px 20px 45px;
}

.hero h1 {
    font-size: 38px;
    margin-bottom: 14px;
}

.hero p {
    color: #a7a7b2;
    font-size: 16px;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

.section-title {
    font-size: 24px;
    margin-bottom: 20px;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 18px;
}

.card {
    background: #13131a;
    border: 1px solid #292933;
    border-radius: 14px;
    padding: 22px;
}

.card h3 {
    margin-bottom: 10px;
}

.card p {
    color: #9999a5;
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 18px;
}

.price {
    font-size: 21px;
    font-weight: bold;
    margin-bottom: 15px;
}

.buy {
    width: 100%;
    padding: 11px;
    border: none;
    border-radius: 8px;
    background: white;
    color: black;
    font-weight: bold;
    cursor: pointer;
}

.footer {
    text-align: center;
    padding: 45px 20px;
    color: #777783;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="navbar">
    <div class="logo">MY STORE</div>
    <button class="nav-btn">Support</button>
</div>

<section class="hero">
    <h1>Digital Services</h1>
    <p>Simple, fast and reliable online services.</p>
</section>

<div class="container">

    <h2 class="section-title">Popular Services</h2>

    <div class="products">

        <div class="card">
            <h3>Service One</h3>
            <p>Digital service with online access.</p>
            <div class="price">₹99</div>
            <button class="buy">Buy Now</button>
        </div>

        <div class="card">
            <h3>Service Two</h3>
            <p>Fast digital service and online delivery.</p>
            <div class="price">₹199</div>
            <button class="buy">Buy Now</button>
        </div>

        <div class="card">
            <h3>Service Three</h3>
            <p>Premium digital service with access.</p>
            <div class="price">₹299</div>
            <button class="buy">Buy Now</button>
        </div>

    </div>

</div>

<div class="footer">
    © 2026 My Store — Digital Services
</div>

</body>
    </html>
